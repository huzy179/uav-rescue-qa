services:
  dev:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    image: floodeye-dev:cpu
    # Gắn cả thư mục dự án: mã nguồn sửa là dùng ngay, data/, runs/ và file trọng số nằm trên máy thật.
    volumes:
      - .:/app
    # PyTorch dùng /dev/shm; mặc định 64 MB của Docker là quá ít.
    shm_size: "2gb"
