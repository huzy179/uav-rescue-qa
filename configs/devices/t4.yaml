# Hồ sơ thời gian thiết bị cho edge/device_sim.py: ước lượng, không phải số đo (TECHNICAL mục 14.6).
name: Tesla T4 (Kaggle)
calibrated: false
source: >-
  Ultralytics, bảng YOLO26 (docs.ultralytics.com/models/yolo26, xem 4/11/2026): YOLO26s 640 trên T4 TensorRT10 2,5 ms/ảnh, lô 1, không gồm tiền và hậu xử lý; trang không ghi độ chính xác số. full_ms = 4 × tile_ms (lượt 1280 có số pixel gấp 4 ô 640). overhead_ms = 0 vì chưa đo: đọc khung, cắt ô, gộp box chưa được tính, nên độ trễ ở đây thấp hơn thật. Thay bằng hồi quy trên timings.jsonl của RQ2 (tools/fit_device_profile.py).
power_mode: không áp dụng
overhead_ms: 0.0
tile_ms: 2.5
full_ms: 10.0
