# Kịch bản cho demo "quét vùng": chuyến bay MÔ PHỎNG quét luống cày (sim/make_rq3.py --render), ảnh tổng hợp vùng ngập
# (nước, mái nhà, cây, rác trôi, người trên mái và dưới nước; sim/render.py). Toạ độ đặt trên mặt Hồ Tây chỉ để bản đồ
