# E2c cắt ô 640 thu nhỏ về 10 px theo độ cao (cấu hình cuối) trên SeaDronesSee val:
# chạy lại cấu hình cuối với cv2.resize trên CPU (như runs/sds_det/E2c_tiled_px10) để có cột tile_ms đo cùng phiên với bản GPU.
source: data/processed/sds_det/images/val
model: runs/train/E2c_s0/weights/best.pt
tile: 640
overlap: 0.2
imgsz: 640
conf: 0.001
max_det: 1000
device: "0"
no_images: true
altitude_csv: data/processed/sds_det/meta_val.csv
target_person_px: 10
output: runs/sds_det/E2c_tiled_px10_cpu
