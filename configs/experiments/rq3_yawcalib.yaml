# RQ3c mô phỏng: tự hiệu chỉnh lệch la bàn trên UAV (--yaw-calib, edge/telemetry.YawCalibrated) khi la bàn lệch cố định
# 0, 5, 10°, bay thẳng hoặc quét luống (có rẽ), ở hai độ cao và hai mức nhiễu GPS. Kịch bản và pipeline như
# rq3_geoerr.yaml (mô hình sai số giữ mặc định); chỉ thêm biến bật/tắt hiệu chỉnh. docs/results/rq3_yawcalib.md.
output: runs/rq3/yawcalib
seeds: [0, 1, 2]
scenario:
  duration_s: 60
  n_people: 10
  recall: 0.7
  fp_per_frame: 0.5
pipeline_config: configs/edge.yaml
pipeline:
  n_confirm: 3
  confirm: geo
grid:
  scenario.alt_m: [50, 100]
  scenario.gps_sigma_m: [1, 3]
  scenario.yaw_bias_deg: [0, 5, 10]
  scenario.pattern: [straight, zigzag]
  pipeline.yaw_calib: [false, true]
