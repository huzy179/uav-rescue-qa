# RQ2 trên Kaggle T4: E2c ở PyTorch, TensorRT FP16 và INT8; toàn ảnh 1280, cắt ô 640 gốc, cắt ô thu nhỏ về 10 px dự kiến.
# Độ chính xác trên SeaDronesSee val (4K, có độ cao) và VisDrone test-dev; thời gian cả pipeline trên đoạn SDS-MOT v21
# (4K, telemetry thật, 2 khung/giây). INT8 hiệu chỉnh trên ô 640 cắt từ val của VisDrone và AFO (tập chọn best.pt của
# E2c, không phải tập test). Chạy bằng notebooks/kaggle_rq2.ipynb; số đo chỉ so sánh tương đối (TECHNICAL 14.4).
output: runs/rq2
weights: runs/train/E2c_s0/weights/best.pt
max_tiles: 32
calib:
  images: [data/processed/visdrone/images/val, data/processed/afo/images/val]
  labels: [data/processed/visdrone/labels/val, data/processed/afo/labels/val]
  max_per_image: 1
speed:
  source: data/processed/sds_mot/val-m100-DJI_0001-v21/frames
  source_fps: 30
  telemetry: data/processed/sds_mot/val-m100-DJI_0001-v21/telemetry.csv
  fps: 2
  max_frames: 100
accuracy:
  - name: sds_det
    images: data/processed/sds_det/images/val
    labels: data/processed/sds_det/labels/val
    altitude_csv: data/processed/sds_det/meta_val.csv
    cluster_pattern: '^(v\d+)_'
  - name: visdrone-testdev
    images: data/processed/visdrone/images/test-dev
    labels: data/processed/visdrone/labels/test-dev
    ignore: data/processed/visdrone/ignore/test-dev
    cluster_pattern: '^(\d+)_'
variants:
  - {name: pt_full1280, precision: pt, mode: full, imgsz: 1280}
  - {name: fp16_full1280, precision: fp16, mode: full, imgsz: 1280}
  - {name: int8_full1280, precision: int8, mode: full, imgsz: 1280}
  - {name: pt_tiled, precision: pt, mode: tiled}
  - {name: fp16_tiled, precision: fp16, mode: tiled}
  - {name: int8_tiled, precision: int8, mode: tiled}
  - {name: pt_tiled_px10, precision: pt, mode: tiled, target_person_px: 10}
  - {name: fp16_tiled_px10, precision: fp16, mode: tiled, target_person_px: 10}
  - {name: int8_tiled_px10, precision: int8, mode: tiled, target_person_px: 10}
