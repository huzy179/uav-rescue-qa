# RQ3c mô phỏng: sai số vị trí cảnh báo theo nhiễu GPS, sai số cố định của hướng bay và của độ cao trong telemetry, ở
# hai độ cao. Pipeline giữ mô hình sai số mặc định (GPS 3 m, độ cao 2 m, hướng 2°, nghiêng 1°) để đo xem bán kính sai số
# tự báo kèm cảnh báo có chứa người thật không khi điều kiện thật khác giả định. Kịch bản như rq3_gps.yaml.
output: runs/rq3/geoerr
seeds: [0, 1, 2]
scenario:
  duration_s: 60
  n_people: 10
  recall: 0.7
  fp_per_frame: 0.5
pipeline_config: configs/edge.yaml
pipeline:
  n_confirm: 3
  confirm: geo
grid:
  scenario.alt_m: [50, 100]
  scenario.gps_sigma_m: [0, 1, 3, 5]
  scenario.yaw_bias_deg: [0, 5]
  scenario.alt_bias_m: [0, 5]
