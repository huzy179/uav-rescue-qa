# Cấu hình mặc định của pipeline UAV (edge/main.py). Tham số gõ trên dòng lệnh được ưu tiên.
model: yolo26s.pt
mode: tiled
tile: 640
overlap: 0.2
conf: 0.1
fps: 2.0
fov_deg: 82.0
fov_type: diagonal
confirm: geo
radius_m: 3.0
n_confirm: 3
window_s: 5.0
expire_s: 6.0
link_probe_s: 2.0  # thăm dò đường truyền mỗi 2 s (quyết định #17, docs/results/rq3_network.md)
gpu_resize: true  # đổi cỡ khung trên GPU khi thu nhỏ theo độ cao (quyết định #20, docs/results/gpu_resize.md)
