<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690" font-family="Arial, Helvetica, sans-serif">
  <!-- Hình 3.1: kiến trúc hai phía (chương 3, mục 3.4). Dựng PNG: tools/thesis_figures.py (sơ đồ) -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <style>
      .side { fill: #f4f6f8; stroke: #555; stroke-width: 1.5; }
      .box { fill: #ffffff; stroke: #222; stroke-width: 1.6; }
      .accent { fill: #fdeee8; stroke: #c4471c; stroke-width: 2; }
      .title { font-size: 22px; font-weight: bold; fill: #111; }
      .h { font-size: 17px; font-weight: bold; fill: #111; }
      .t { font-size: 14px; fill: #333; }
      .n { font-size: 13px; font-weight: bold; fill: #fff; }
      .arrow { stroke: #222; stroke-width: 1.8; fill: none; marker-end: url(#a); }
      .dash { stroke: #c4471c; stroke-width: 2.2; fill: none; stroke-dasharray: 9 6; marker-end: url(#a); }
      .lbl { font-size: 14px; fill: #c4471c; font-weight: bold; }
    </style>
  </defs>
  <rect width="1400" height="690" fill="#fff"/>

  <!-- UAV -->
  <rect class="side" x="20" y="20" width="1360" height="290" rx="10"/>
  <text class="title" x="40" y="54">On the UAV (edge device)</text>

  <rect class="box" x="40" y="90" width="170" height="160" rx="8"/>
  <text class="h" x="56" y="120">Camera and</text>
  <text class="h" x="56" y="141">telemetry</text>
  <text class="t" x="56" y="170">4K video</text>
  <text class="t" x="56" y="190">GPS, altitude,</text>
  <text class="t" x="56" y="208">heading, gimbal</text>

  <g>
    <rect class="box" x="250" y="90" width="185" height="160" rx="8"/>
    <circle cx="270" cy="112" r="12" fill="#222"/><text class="n" x="266" y="117">1</text>
    <text class="h" x="290" y="118">Sampling</text>
    <text class="t" x="264" y="150">Fixed rate, or rate</text>
    <text class="t" x="264" y="168">from altitude and</text>
    <text class="t" x="264" y="186">speed (option);</text>
    <text class="t" x="264" y="204">telemetry at the</text>
    <text class="t" x="264" y="222">frame's time</text>
  </g>
  <g>
    <rect class="accent" x="470" y="90" width="185" height="160" rx="8"/>
    <circle cx="490" cy="112" r="12" fill="#c4471c"/><text class="n" x="486" y="117">2</text>
    <text class="h" x="510" y="118">Detection</text>
    <text class="t" x="484" y="150">YOLO26 on tiles</text>
    <text class="t" x="484" y="168">in one batch;</text>
    <text class="t" x="484" y="186">altitude-based</text>
    <text class="t" x="484" y="204">downscaling (option)</text>
  </g>
  <g>
    <rect class="box" x="690" y="90" width="185" height="160" rx="8"/>
    <circle cx="710" cy="112" r="12" fill="#222"/><text class="n" x="706" y="117">3</text>
    <text class="h" x="730" y="118">Geolocation</text>
    <text class="t" x="704" y="150">Box → GPS position</text>
    <text class="t" x="704" y="168">on the ground, with</text>
    <text class="t" x="704" y="186">an error estimate</text>
  </g>
  <g>
    <rect class="accent" x="910" y="90" width="185" height="160" rx="8"/>
    <circle cx="930" cy="112" r="12" fill="#c4471c"/><text class="n" x="926" y="117">4</text>
    <text class="h" x="950" y="118">Confirmation</text>
    <text class="t" x="924" y="150">Group by ground</text>
    <text class="t" x="924" y="168">position; seen N</text>
    <text class="t" x="924" y="186">times in a window</text>
    <text class="t" x="924" y="204">→ one alert</text>
  </g>
  <g>
    <rect class="box" x="1130" y="90" width="230" height="160" rx="8"/>
    <circle cx="1150" cy="112" r="12" fill="#222"/><text class="n" x="1146" y="117">5</text>
    <text class="h" x="1170" y="118">Delivery (outbox)</text>
    <text class="t" x="1144" y="150">SQLite queue on disk;</text>
    <text class="t" x="1144" y="168">coordinates first,</text>
    <text class="t" x="1144" y="186">crop later; retry and</text>
    <text class="t" x="1144" y="204">link probing</text>
  </g>
  <path class="arrow" d="M210,170 L248,170"/>
  <path class="arrow" d="M435,170 L468,170"/>
  <path class="arrow" d="M655,170 L688,170"/>
  <path class="arrow" d="M875,170 L908,170"/>
  <path class="arrow" d="M1095,170 L1128,170"/>
  <text class="t" x="40" y="290">Every stage writes a JSONL log; metrics are computed afterwards from the logs.</text>
  <rect x="700" y="278" width="16" height="16" class="accent"/>
  <text class="t" x="724" y="291">Stages studied most (research questions 1 and 3)</text>

  <!-- link -->
  <path class="dash" d="M1245,252 L1245,386"/>
  <path class="dash" d="M1205,388 L1205,254"/>
  <text class="lbl" x="1262" y="335">alerts, crops,</text>
  <text class="lbl" x="1262" y="353">status (1 s)</text>
  <text class="lbl" x="1160" y="345">ack</text>
  <text class="lbl" x="560" y="345" text-anchor="middle">Unreliable link: packet loss and outages of tens of seconds</text>
  <line x1="40" y1="330" x2="1080" y2="330" stroke="#c4471c" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ground -->
  <rect class="side" x="20" y="390" width="1360" height="280" rx="10"/>
  <text class="title" x="40" y="424">At the ground station</text>

  <rect class="box" x="1080" y="440" width="280" height="160" rx="8"/>
  <text class="h" x="1096" y="470">API and storage</text>
  <text class="t" x="1096" y="500">Duplicate alert IDs ignored;</text>
  <text class="t" x="1096" y="518">crop accepted only after</text>
  <text class="t" x="1096" y="536">its coordinates; SQLite</text>

  <rect class="box" x="770" y="440" width="270" height="160" rx="8"/>
  <text class="h" x="786" y="470">Incident merging</text>
  <text class="t" x="786" y="500">Alerts of the same person,</text>
  <text class="t" x="786" y="518">from one or several UAVs,</text>
  <text class="t" x="786" y="536">become one incident</text>

  <rect class="box" x="470" y="440" width="260" height="160" rx="8"/>
  <text class="h" x="486" y="470">Priority</text>
  <text class="t" x="486" y="500">Rule-based score: operator</text>
  <text class="t" x="486" y="518">tag, confidence, UAVs that</text>
  <text class="t" x="486" y="536">saw it, nearby incidents,</text>
  <text class="t" x="486" y="554">waiting time; each part</text>
  <text class="t" x="486" y="572">shown as a reason</text>

  <rect class="box" x="40" y="440" width="390" height="160" rx="8"/>
  <text class="h" x="56" y="470">Dispatch screen</text>
  <text class="t" x="56" y="500">Operator and rescue team. Offline map:</text>
  <text class="t" x="56" y="518">UAV position, scanned area, incidents</text>
  <text class="t" x="56" y="536">with 95% search area and crop; tags,</text>
  <text class="t" x="56" y="554">close as rescued or false alarm;</text>
  <text class="t" x="56" y="572">boat visiting order, GPX export</text>

  <path class="arrow" d="M1080,520 L1042,520"/>
  <path class="arrow" d="M770,520 L732,520"/>
  <path class="arrow" d="M470,520 L432,520"/>
  <text class="t" x="40" y="650">Drone and station share only the message schema (shared/); the UAV sends no video to the ground.</text>
</svg>
