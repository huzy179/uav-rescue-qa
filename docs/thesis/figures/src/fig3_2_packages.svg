<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="Arial, Helvetica, sans-serif">
  <!-- Hình 3.2: các gói và quan hệ import thật (đo bằng grep các dòng import, 26/11/2026). Dựng PNG: tools/thesis_figures.py -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <style>
      .layer { fill: #f4f6f8; stroke: #888; stroke-width: 1.2; }
      .pkg { fill: #fff; stroke: #222; stroke-width: 1.6; }
      .run { fill: #fdeee8; stroke: #c4471c; stroke-width: 2; }
      .h { font-size: 19px; font-weight: bold; fill: #111; font-family: "Courier New", monospace; }
      .t { font-size: 14px; fill: #333; }
      .small { font-size: 13px; fill: #555; }
      .ar { stroke: #222; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .ar2 { stroke: #222; stroke-width: 1.4; fill: none; stroke-dasharray: 6 5; marker-end: url(#a); }
      .no { stroke: #c4471c; stroke-width: 2.5; }
      .lbl { font-size: 13px; fill: #c4471c; font-weight: bold; }
    </style>
  </defs>
  <rect width="1400" height="640" fill="#fff"/>

  <!-- tools layer -->
  <rect class="layer" x="20" y="20" width="1360" height="100" rx="8"/>
  <text class="t" x="40" y="48" font-weight="bold">Command-line programs and the experiment console (use every package below)</text>
  <rect class="pkg" x="40" y="62" width="300" height="44" rx="6"/><text class="h" x="56" y="90">scripts/</text><text class="small" x="160" y="90">run experiments</text>
  <rect class="pkg" x="370" y="62" width="300" height="44" rx="6"/><text class="h" x="386" y="90">tools/</text><text class="small" x="470" y="90">data and thesis tools</text>
  <rect class="pkg" x="700" y="62" width="300" height="44" rx="6"/><text class="h" x="716" y="90">training/</text><text class="small" x="830" y="90">fine-tuning</text>
  <rect class="pkg" x="1030" y="62" width="330" height="44" rx="6"/><text class="h" x="1046" y="90">console/</text><text class="small" x="1150" y="90">experiment console</text>

  <!-- middle row -->
  <rect class="run" x="40" y="190" width="300" height="200" rx="8"/>
  <text class="h" x="56" y="222">edge/</text>
  <text class="t" x="56" y="250">Runs on the UAV</text>
  <text class="t" x="56" y="276">sampler, telemetry, detector,</text>
  <text class="t" x="56" y="294">geolocation, confirmer,</text>
  <text class="t" x="56" y="312">outbox and transport, main loop</text>
  <text class="small" x="56" y="344">Only detector.py imports</text>
  <text class="small" x="56" y="362">the detection library</text>

  <rect class="pkg" x="420" y="190" width="250" height="200" rx="8"/>
  <text class="h" x="436" y="222">sim/</text>
  <text class="t" x="436" y="250">Simulators</text>
  <text class="t" x="436" y="276">flight, people and</text>
  <text class="t" x="436" y="294">scenarios, network</text>
  <text class="t" x="436" y="312">outages, device timing,</text>
  <text class="t" x="436" y="330">parameter sweeps</text>

  <rect class="pkg" x="750" y="190" width="250" height="200" rx="8"/>
  <text class="h" x="766" y="222">eval/</text>
  <text class="t" x="766" y="250">Metrics from logs</text>
  <text class="t" x="766" y="276">AP by size, bootstrap,</text>
  <text class="t" x="766" y="294">system metrics, timing,</text>
  <text class="t" x="766" y="312">tables and drawing</text>

  <rect class="run" x="1080" y="190" width="280" height="200" rx="8"/>
  <text class="h" x="1096" y="222">ground/</text>
  <text class="t" x="1096" y="250">Runs at the ground station</text>
  <text class="t" x="1096" y="276">API and storage, incident</text>
  <text class="t" x="1096" y="294">merging, priority,</text>
  <text class="t" x="1096" y="312">dispatch screen</text>
  <text class="small" x="1096" y="344">No PyTorch, detection</text>
  <text class="small" x="1096" y="362">library or OpenCV</text>

  <!-- shared -->
  <rect class="layer" x="20" y="480" width="1360" height="80" rx="8"/>
  <rect class="pkg" x="40" y="494" width="1320" height="52" rx="6"/>
  <text class="h" x="56" y="527">shared/</text>
  <text class="t" x="160" y="526">Message schema (alerts, crops, status), YAML configuration, run provenance; depends only on pydantic and PyYAML</text>

  <!-- imports to shared -->
  <path class="ar" d="M190,390 L190,492"/>
  <path class="ar" d="M545,390 L545,492"/>
  <path class="ar" d="M875,390 L875,492"/>
  <path class="ar" d="M1220,390 L1220,492"/>

  <!-- sim <-> edge -->
  <path class="ar" d="M420,250 L342,250"/>
  <path class="ar2" d="M340,300 L418,300"/>
  <!-- eval -> sim, eval -> ground, eval -> edge -->
  <path class="ar" d="M750,250 L672,250"/>
  <path class="ar" d="M1000,250 L1078,250"/>
  <path class="ar" d="M800,190 C 760,150 300,150 230,188"/>
  <!-- edge main -> eval.draw -->
  <path class="ar2" d="M260,390 C 300,440 760,440 800,392"/>

  <!-- no imports between edge and ground -->
  <line class="no" x1="1010" y1="152" x2="1026" y2="168"/>
  <line class="no" x1="1026" y1="152" x2="1010" y2="168"/>
  <text class="lbl" x="1036" y="165">edge/ and ground/ never import each other</text>

  <text class="small" x="40" y="595">A → B: A imports B. Solid: library use. Dashed: only the main loop (edge/main.py), for replay with a simulated flight and network</text>
  <text class="small" x="40" y="613">and for drawing boxes on the saved video. Orange: the two programs that are deployed (UAV and ground station).</text>
</svg>
